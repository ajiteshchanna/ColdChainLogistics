name: REEFERTWIN CI and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'FDE-YT-Cold'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        shell: bash
        run: python -m compileall -q src scripts

      - name: Run unit tests
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v

      - name: Validate offline health
        run: python scripts/health_check.py

      - name: Build container
        run: docker build --tag reefertwin:${{ github.sha }} .

  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'FDE-YT-Cold' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/cold-chain-logistics-FDE-Project
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            python scripts/check_startup.py
            python -m unittest discover -s tests/unit -p 'test_*.py'
            sudo systemctl restart streamlit
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
                exit 0
              fi
              sleep 5
            done
            exit 1